#
# Two claims this repository makes, checked on every change so they cannot rot:
#   1. every file that names the release names the same release;
#   2. foxentry/countries.py is reproducible from its stated sources;
#   3. every query the tool builds is one the Foxentry API actually declares;
#   4. every GitHub Action is pinned to an immutable commit SHA.
#
# It also runs the tests. They are not a general suite: each one is a fence around a hole we
# have already fallen into.
#
# Actions are pinned to an immutable commit SHA, with the version in a comment. A tag can be
# moved to point at different code; a SHA cannot. Same style as scorecard.yml, and what the
# OpenSSF Scorecard Pinned-Dependencies check expects.
name: Consistency

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the data cleaner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the Foxentry OpenAPI specification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Foxentry/OAS
          path: .oas

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the build dependencies
        run: pip install phonenumbers Babel PyYAML pyflakes pytest

      - name: Versions agree across every file
        run: python tools/check_release.py

      - name: countries.py is reproducible from the OAS
        run: python tools/update_countries.py --oas .oas --check

      - name: Every query the tool builds matches the OAS
        run: python tools/check_query_schema.py --oas .oas

      - name: Every action is pinned to a commit SHA
        run: python tools/check_action_pins.py

      - name: No undefined names or unused imports
        run: python -m pyflakes foxentry/*.py tools/*.py run.py tests/*.py

      - name: Tests
        run: python -m pytest tests -q
