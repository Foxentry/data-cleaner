name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # allow a manual build without tagging

# Minimal default token; jobs elevate only what they need.
permissions:
  contents: read

jobs:
  # ───────────────────────── Release gate ────────────────────────────
  # Nothing is built, signed or published until the repository agrees with the tag being
  # released. check_release.py without --tag only proves the files agree with each other:
  # tagging v2.0.1 over files that say 2.0.0 would sail through. This is where the tag is
  # part of the comparison, and it is the only place it can be.
  #
  # Actions here are pinned to an immutable commit SHA (version in the comment), as in
  # scorecard.yml and consistency.yml. A tag can be moved to point at other code; a SHA cannot.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: Every file names the version being released
        # A tagged release is checked against the tag. A manual run (workflow_dispatch) has no
        # tag - `github.ref_name` would be the branch - so it only checks the files against
        # each other.
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            python tools/check_release.py --tag "${{ github.ref_name }}"
          else
            python tools/check_release.py
          fi

  # ───────────────────────────── Windows ─────────────────────────────
  build-windows:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write       # create the GitHub Release
      id-token: write       # OIDC for provenance attestation
      attestations: write   # write the attestation
    env:
      SIGN_ENABLED: ${{ secrets.AZURE_TENANT_ID != '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - name: Install build deps
        run: pip install pyinstaller openpyxl==3.1.5 et_xmlfile==2.0.0
      - name: Build (PyInstaller)
        run: pyinstaller packaging/foxentry.spec --clean

      - name: Sign (Azure Trusted Signing)
        if: env.SIGN_ENABLED == 'true'
        uses: azure/trusted-signing-action@bb15ca63eb5548cc306f4f335c5617bb414abcad # v0.5.9
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify signature
        if: env.SIGN_ENABLED == 'true'
        shell: pwsh
        run: |
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          & $st.FullName verify /pa /v dist\FoxentryDataCleaner.exe

      - name: Checksums
        shell: pwsh
        run: |
          cd dist
          (Get-FileHash FoxentryDataCleaner.exe -Algorithm SHA256).Hash + "  FoxentryDataCleaner.exe" |
            Out-File -Encoding ascii FoxentryDataCleaner.exe.sha256
      - name: Attest provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with: { subject-path: dist/FoxentryDataCleaner.exe }
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/FoxentryDataCleaner.exe
            dist/FoxentryDataCleaner.exe.sha256
      - name: Upload artifact (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: FoxentryDataCleaner-windows, path: "dist/FoxentryDataCleaner.exe*" }

  # ───────────────────────────── macOS ─────────────────────────────
  build-macos:
    needs: verify
    runs-on: macos-latest
    permissions:
      contents: write       # create the GitHub Release
      id-token: write       # OIDC for provenance attestation
      attestations: write   # write the attestation
    env:
      SIGN_ENABLED: ${{ secrets.APPLE_DEVELOPER_ID != '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - name: Install build deps
        run: pip install pyinstaller openpyxl==3.1.5 et_xmlfile==2.0.0
      - name: Build (PyInstaller)
        run: pyinstaller packaging/foxentry.spec --clean
      - name: Keep the bare binary for command-line use
        run: |
          cp "dist/Foxentry Data Cleaner.app/Contents/MacOS/FoxentryDataCleaner" dist/FoxentryDataCleaner-macos
          chmod +x dist/FoxentryDataCleaner-macos

      # Signing, notarization and stapling.
      #
      # A .app can be STAPLED: the notarization ticket is attached to the bundle, so Gatekeeper
      # clears it without asking Apple. A bare binary cannot be stapled, which is why the 2.0.0
      # download needed an internet connection on first launch - and a terminal, because a
      # browser download strips the execute bit and Finder cannot open an extensionless file.
      #
      # Notarize twice on purpose: once for the app (so the app is stapled even after it is
      # dragged out of the disk image), once for the .dmg itself (so the image opens cleanly).
      - name: Sign, notarize & staple (Apple Developer ID)
        if: env.SIGN_ENABLED == 'true'
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PWD: ${{ secrets.APPLE_CERT_PASSWORD }}
          DEV_ID:   ${{ secrets.APPLE_DEVELOPER_ID }}
          AC_ID:    ${{ secrets.APPLE_ID }}
          AC_PWD:   ${{ secrets.APPLE_APP_PASSWORD }}
          AC_TEAM:  ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain

          APP="dist/Foxentry Data Cleaner.app"

          # The hardened runtime is required for notarization. The entitlements are what let
          # PyInstaller's onefile bootloader load the interpreter it unpacks at runtime.
          codesign --force --deep --options runtime --timestamp \
                   --entitlements packaging/entitlements.plist \
                   -s "$DEV_ID" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          ditto -c -k --keepParent "$APP" notarize-app.zip
          xcrun notarytool submit notarize-app.zip \
                --apple-id "$AC_ID" --password "$AC_PWD" --team-id "$AC_TEAM" --wait
          xcrun stapler staple "$APP"

          # The disk image: what the user downloads and double-clicks. The Applications symlink
          # is the "drag me here" target.
          mkdir -p dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Foxentry Data Cleaner" -srcfolder dmg -ov -format UDZO \
                  dist/FoxentryDataCleaner-macos.dmg
          codesign --force --timestamp -s "$DEV_ID" dist/FoxentryDataCleaner-macos.dmg
          xcrun notarytool submit dist/FoxentryDataCleaner-macos.dmg \
                --apple-id "$AC_ID" --password "$AC_PWD" --team-id "$AC_TEAM" --wait
          xcrun stapler staple dist/FoxentryDataCleaner-macos.dmg

          # It is stapled only if Gatekeeper says so without a network round-trip.
          xcrun stapler validate "$APP"
          xcrun stapler validate dist/FoxentryDataCleaner-macos.dmg
          spctl --assess --type execute --verbose=4 "$APP"

      # No Apple secrets: still ship a disk image, just an unsigned one.
      - name: Package (unsigned)
        if: env.SIGN_ENABLED != 'true'
        run: |
          mkdir -p dmg && cp -R "dist/Foxentry Data Cleaner.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Foxentry Data Cleaner" -srcfolder dmg -ov -format UDZO \
                  dist/FoxentryDataCleaner-macos.dmg

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 FoxentryDataCleaner-macos.dmg > FoxentryDataCleaner-macos.dmg.sha256
          shasum -a 256 FoxentryDataCleaner-macos     > FoxentryDataCleaner-macos.sha256
      - name: Attest provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/FoxentryDataCleaner-macos.dmg
            dist/FoxentryDataCleaner-macos
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/FoxentryDataCleaner-macos.dmg
            dist/FoxentryDataCleaner-macos.dmg.sha256
            dist/FoxentryDataCleaner-macos
            dist/FoxentryDataCleaner-macos.sha256
      - name: Upload artifact (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: FoxentryDataCleaner-macos, path: "dist/FoxentryDataCleaner-macos*" }

  # ───────────────────────────── Linux ─────────────────────────────
  build-linux:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub Release
      id-token: write       # OIDC for provenance attestation
      attestations: write   # write the attestation
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - name: Install build deps
        run: pip install pyinstaller openpyxl==3.1.5 et_xmlfile==2.0.0
      - name: Build (PyInstaller)
        run: pyinstaller packaging/foxentry.spec --clean
      - name: Rename
        run: mv dist/FoxentryDataCleaner dist/FoxentryDataCleaner-linux && chmod +x dist/FoxentryDataCleaner-linux
      - name: Checksums
        run: cd dist && sha256sum FoxentryDataCleaner-linux > FoxentryDataCleaner-linux.sha256
      - name: Attest provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with: { subject-path: dist/FoxentryDataCleaner-linux }
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/FoxentryDataCleaner-linux
            dist/FoxentryDataCleaner-linux.sha256
      - name: Upload artifact (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: FoxentryDataCleaner-linux, path: "dist/FoxentryDataCleaner-linux*" }
